services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432" # 5433 avoids clashing with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the compose network the db is reachable as "db" on its internal port.
      DATABASE_URL: postgresql+psycopg://rag:rag@db:5432/rag
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads # original PDFs survive container rebuilds
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
