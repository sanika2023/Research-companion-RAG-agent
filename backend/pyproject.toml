[project]
name = "paper-rag-backend"
version = "0.1.0"
description = "Auditable research companion: hybrid-search RAG with citations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "psycopg[binary]>=3.3.8",
    "alembic>=1.20.1",
    "pgvector>=0.5.1",
    "pymupdf>=2.1",
    "fastembed>=0.9.1",
    "python-multipart>=0.0.33",
    "langgraph>=1.2",
    "google-genai>=3.3",
    "httpx2>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the real Postgres container"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests may touch tmp files synchronously; no event loop is serving users there.
"tests/**" = ["ASYNC240"]

[tool.mypy]
strict = true

# PyMuPDF ships partial type hints that strict mode rejects; treat it as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true
